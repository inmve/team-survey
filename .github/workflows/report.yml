name: Survey report

on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:
  schedule:
    - cron: "15 6 * * *" # daily, so the results open on closes_on even without a new answer

permissions:
  contents: write
  issues: read

concurrency:
  group: survey-report
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'survey')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Fetch answers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue list --label survey --state all --limit 1000 --json number,author,body,createdAt,updatedAt > issues.json
      - run: python scripts/build_report.py survey.yml issues.json
      - name: Commit the report
        run: |
          git config user.name "survey-report"
          git config user.email "survey-report@users.noreply.github.com"
          git add REPORT.md report/answers.svg
          git diff --cached --quiet || git commit -m "Update survey report"
          git push
