name: Build survey form

on:
  push:
    paths: [survey.yml, scripts/build_form.py]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create the survey label
        # repositories created from a template do not get its labels, and the report finds answers by this label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create survey --color 0E8A16 --description "Survey answers" --force --repo "${{ github.repository }}"
      - run: pip install pyyaml==6.0.2
      - run: python scripts/build_form.py
      - name: Commit the form
        run: |
          git config user.name "survey-form"
          git config user.email "survey-form@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/survey.yml
          git diff --cached --quiet || git commit -m "Rebuild survey form from survey.yml"
          git push
