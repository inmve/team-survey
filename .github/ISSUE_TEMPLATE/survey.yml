# Generated from survey.yml by scripts/build_form.py. Edit survey.yml, not this file.
name: "State of Agentic Practices: team survey"
description: "One answer per person. You can edit your issue later to update your answers."
title: "Survey answers"
labels: ["survey"]
body:
  - type: markdown
    attributes:
      value: "**Takes about 4 minutes.** Results open on 1 December 2026, or earlier once all 12 people have answered.\n\nFor each practice, pick the answer that is true for you today. There are no right answers: the point is to see where the team actually is. Answers are visible to everyone with access to this repository."
  - type: dropdown
    id: "context-role"
    attributes:
      label: "Your role"
      options: ["Engineer", "Tech lead", "Engineering manager", "Designer or product", "Other"]
    validations:
      required: true
  - type: dropdown
    id: "context-agent_experience"
    attributes:
      label: "How long have you been coding with agents?"
      options: ["Not yet", "Less than 3 months", "3 to 12 months", "More than a year"]
    validations:
      required: true
  - type: markdown
    attributes:
      value: "### Planning"
  - type: dropdown
    id: "plan-first-before-coding"
    attributes:
      label: "Ask to plan first"
      description: "Tell the agent to outline steps, risks and quick tests before touching code, so you can review and adjust the approach."
      options: ["Never heard of it", "Heard of it, not interested", "Heard of it, want to try", "Tried it, would not use again", "Use it, will keep using"]
    validations:
      required: true
  - type: dropdown
    id: "specification-driven-development"
    attributes:
      label: "Write detailed specs"
      description: "Give the agent a comprehensive spec; even a conversational spec beats vague instructions."
      options: ["Never heard of it", "Heard of it, not interested", "Heard of it, want to try", "Tried it, would not use again", "Use it, will keep using"]
    validations:
      required: true
  - type: markdown
